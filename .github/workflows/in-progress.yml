name: Run from In Progress

on:
  repository_dispatch:
    types:
      - ptp_plabug_inprogress2

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Print jira payload
        run: |
          echo "To na ação ptp_plabug_inprogress"
          echo "Ticket: ${{ github.event.client_payload.ticket }}"
          echo "Summary: ${{ github.event.client_payload.summary }}"
          echo "Status: ${{ github.event.client_payload.status }}"
          echo "URL: ${{ github.event.client_payload.url }}"
          echo "Type: ${{ github.event.client_payload.type }}"
          echo "Priority: ${{ github.event.client_payload.priority }}"
          echo "Assignee: ${{ github.event.client_payload.assignee }}"
          echo "Reporter: ${{ github.event.client_payload.reporter }}"
          echo "Project: ${{ github.event.client_payload.project }}"
